<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripture Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Scripture Tracker</h1>
    <p class="subtitle">Track your scripture notes</p>

    <div id="email-section" class="email-section"></div>

    <div class="table-wrapper">
      <table id="workout-table">
        <thead>
          <tr>
            <th>Reference</th>
            <th>Scripture Text</th>
            <th>Pro / Con</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="theory-tbody"></tbody>
      </table>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
